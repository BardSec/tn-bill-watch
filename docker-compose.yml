services:
  # Set-it-and-forget-it: runs a check every 24 hours automatically.
  # Start with: docker compose up -d scheduler
  scheduler:
    build: .
    env_file: .env
    volumes:
      - bill-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      while true; do
        python main.py check --notify;
        sleep 86400;
      done
    restart: unless-stopped

  # Manual one-shot use: docker compose run --rm app check|list|report
  app:
    build: .
    env_file: .env
    volumes:
      - bill-data:/data
    profiles: ["manual"]
    command: check

volumes:
  bill-data:
